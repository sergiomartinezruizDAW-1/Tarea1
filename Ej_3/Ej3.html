<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>
    <link rel="stylesheet" href="CSS\estilo.css">
</head>

<body>
    <header>
        <h1>Tablas</h1>
    </header>

    <main>
        <table class="tabla1">
            <caption>Tabla prueba 1</caption>
            <thead>
                <tr>
                    <th>columna 1</th>
                    <th>columna 2</th>
                    <th>columna 3</th>
                    <th>columna 4</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="borde1">col1</td>
                    <td class="borde1" colspan="2" align="left">col2</td>
                    <td rowspan="2">col3</td>
                </tr>
                <tr>
                    <td class="borde1">colum1</td>
                    <td class="borde1">colum2</td>
                    <td class="borde1">colum4</td>
                </tr>
            </tbody>
        </table>

        <table class="tabla2">
            <caption>Tabla prueba 2</caption>
            <thead>
                <tr>
                    <th>columna 1</th>
                    <th>columna 2</th>
                    <th>columna 3</th>
                    <th>columna 4</th>
                </tr>
            </thead>
            <tbody>
                <tr class="par">
                    <td class="borde2">col1</td>
                    <td class="borde2" colspan="2" align="left">col2</td>
                    <td class="borde2">col3</td>
                </tr>
                <tr>
                    <td class="borde2">colum1</td>
                    <td class="borde2" rowspan="2">colum2</td>
                    <td class="borde2">colum3</td>
                    <td class="borde2">colum4</td>
                </tr>
                <tr class="par">
                    <td class="borde2">column1</td>
                    <td class="borde2">column3</td>
                    <td class="borde2">column4</td>
                </tr>
                <tr>
                    <td class="borde2">colu1</td>
                    <td class="borde2">colu2</td>
                    <td class="borde2">colu3</td>
                    <td class="borde2">colu4</td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer>

    </footer>
</body>
